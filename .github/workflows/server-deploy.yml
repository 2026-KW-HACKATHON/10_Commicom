# 서버(server) 자동 배포: main 에 server/** 가 바뀌어 올라오면 jar 를 빌드해 EC2(15.164.102.84)에 올리고 재시작
# 새 jar 가 안 뜨면 옛 jar 로 되돌림.
# ⚠️ DB 구조가 바뀌는 변경은 server/docs/sql/ 의 SQL 을 운영 DB에 먼저 실행한 뒤 main 에 올릴 것 (운영 ddl-auto: validate)
# 필요한 저장소 Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   (IAM 사용자 권한: ec2-instance-connect:SendSSHPublicKey 를 이 인스턴스에만 — 루트 계정 키는 쓰지 말 것)
name: server-deploy

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-deploy.yml']
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

env:
  EC2_HOST: 15.164.102.84
  EC2_INSTANCE_ID: i-0697fbb64235b8943
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: jar 빌드
        working-directory: server
        run: |
          chmod +x gradlew
          ./gradlew bootJar --console=plain -x test
          cp build/libs/*-SNAPSHOT.jar ../itda.jar

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 임시 접속 키 (EC2 Instance Connect, 60초 유효)
        run: |
          ssh-keygen -t ed25519 -N "" -q -f key
          push() { aws ec2-instance-connect send-ssh-public-key --instance-id "$EC2_INSTANCE_ID" --instance-os-user ec2-user --ssh-public-key file://key.pub >/dev/null; }
          declare -f push > push.sh

      - name: 업로드
        run: |
          source push.sh && push
          scp -i key -o StrictHostKeyChecking=accept-new itda.jar ec2-user@$EC2_HOST:/home/ec2-user/itda.jar.new

      - name: 교체 + 재시작 (실패하면 옛 jar 로)
        run: |
          source push.sh && push
          ssh -i key -o StrictHostKeyChecking=accept-new ec2-user@$EC2_HOST '
            set -e
            TS=$(date +%Y%m%d-%H%M%S)
            mkdir -p ~/backup && cp ~/itda.jar ~/backup/itda-$TS.jar
            mv ~/itda.jar.new ~/itda.jar
            sudo systemctl restart itda
            for i in $(seq 1 240); do grep -q "Started ItdaApplication" ~/app.log && { echo "✅ 서버 시작됨"; exit 0; }; sleep 1; done
            echo "❌ 시작 실패 — 옛 jar 로 되돌림"; grep -E "ERROR|Caused by" ~/app.log | head -10
            cp ~/backup/itda-$TS.jar ~/itda.jar && sudo systemctl restart itda
            exit 1'

      - name: 확인
        run: |
          sleep 5
          curl -fsS "http://$EC2_HOST:8080/api/stores" > /dev/null && echo "✅ API 정상"
