spring:
  application:
    name: itda
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # server/.env 가 있으면 읽어온다 (없으면 OS 환경변수만 사용)
  config:
    import: optional:file:.env[.properties]

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    bedrock:
      aws:
        region: ${AWS_REGION:ap-northeast-2}
      converse:
        chat:
          options:
            model: ${BEDROCK_MODEL_ID}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
    presigned-url-expiration-minutes: 10
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}
  polly:
    voice-id: ${AWS_POLLY_VOICE_ID:Seoyeon}

video:
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  work-dir: ${VIDEO_WORK_DIR:./tmp/video}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
